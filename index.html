<!DOCTYPE html>
<html lang="de">
<head>
  <!-- Wird beim Bauen durch --base-href ersetzt (z. B. /studyscan-test/). -->
  <base href="/studyscan-test/">

  <meta charset="UTF-8">
  <meta name="description" content="StudyScan AI – Test-Version im Browser">
  <!-- Nur zum Testen: nicht in Suchmaschinen aufnehmen. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F7F6F2">

  <!-- iPhone: "Zum Home-Bildschirm" öffnet die App ohne Browser-Leiste. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="StudyScan">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>StudyScan AI (Test)</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F7F6F2; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 17px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      color: #66655F;
    }
    #loading img { width: 72px; height: 72px; border-radius: 16px; }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <div>StudyScan wird geladen …</div>
  </div>
  <noscript>Bitte JavaScript einschalten, damit StudyScan läuft.</noscript>
  <script src="flutter_bootstrap.js?v=20261025144802" async></script>
</body>
</html>
