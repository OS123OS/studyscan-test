# Trainiert das Blatt-Erkennungsnetz für die StudyScan-Testversion.
# Läuft bei jedem Push auf den Zweig ml-training (Einstellungen: ml/RUN.json)
# und legt die Ergebnisse auf den Zweig ml-results.
name: Blatt-Erkennung trainieren

on:
  push:
    branches: [ml-training]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ml-training
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.cfg.outputs.matrix }}
      minutes: ${{ steps.cfg.outputs.minutes }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          echo "matrix=$(jq -c '.configs' ml/RUN.json)" >> "$GITHUB_OUTPUT"
          echo "minutes=$(jq -r '.minutes' ml/RUN.json)" >> "$GITHUB_OUTPUT"

  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0 numpy==2.1.3
      - name: Texturen (CC0)
        run: python ml/prep.py textures data/textures
      - name: SmartDoc 2015 (CC BY 4.0)
        run: python ml/prep.py smartdoc data/real_train data/real_eval
      - run: du -sh data/*; ls data/textures | head -20; ls data/textures | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: data
          retention-days: 7

  train:
    needs: [setup, prep]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install pillow==11.0.0 numpy==2.1.3 onnx==1.17.0
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: data
      - name: Trainieren
        working-directory: ml
        run: >
          python train.py --minutes ${{ needs.setup.outputs.minutes }}
          --out ../out/${{ matrix.cfg.name }}
          --textures ../data/textures --real ../data/real_train
          --eval-real ../data/real_eval
          --widths ${{ matrix.cfg.widths }} --dec ${{ matrix.cfg.dec }}
          --workers 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.cfg.name }}
          path: out
          retention-days: 7

  publish:
    needs: [train]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Ergebnisse auf den Zweig ml-results
        env:
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch ml-results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" res \
            || { git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" res && cd res && git checkout --orphan ml-results && git rm -rq . && cd ..; }
          mkdir -p "res/runs/$RUN"
          for d in art/out-*; do
            [ -d "$d" ] || continue
            cp -r "$d"/* "res/runs/$RUN/"
          done
          find "res/runs/$RUN" -name '*.pt' -size +40M -delete || true
          if [ ! -d res/eval_real ] && [ -d art/data/real_eval ]; then
            cp -r art/data/real_eval res/eval_real
          fi
          echo "$SHA" > "res/runs/$RUN/source_sha.txt"
          cd res
          git add -A
          git commit -q -m "Trainingslauf $RUN" || exit 0
          git push -q origin ml-results
