# Trainiert das Blatt-Erkennungsnetz für die StudyScan-Testversion.
# Läuft bei jedem Push auf den Zweig ml-training (Einstellungen: ml/RUN.json)
# und legt die Ergebnisse auf den Zweig ml-results.
name: Blatt-Erkennung trainieren

on:
  push:
    branches: [ml-training]
  workflow_dispatch:

permissions:
  contents: write

# Ein neuer Push wartet, bis der laufende Lauf fertig ist (ein langes
# Training wird nicht abgebrochen).
concurrency:
  group: ml-training
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.cfg.outputs.matrix }}
      minutes: ${{ steps.cfg.outputs.minutes }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          echo "matrix=$(jq -c '.configs' ml/RUN.json)" >> "$GITHUB_OUTPUT"
          echo "minutes=$(jq -r '.minutes' ml/RUN.json)" >> "$GITHUB_OUTPUT"

  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0 numpy==2.1.3
      - name: Texturen (CC0)
        run: |
          mkdir -p data
          python ml/prep.py textures data/textures 2>&1 | tee -a data/prep_log.txt
      - name: SmartDoc 2015 (CC BY 4.0)
        run: python ml/prep.py smartdoc data/real_train data/real_eval 2>&1 | tee -a data/prep_log.txt
      - run: |
          { du -sh data/*; ls data/textures | wc -l; } 2>&1 | tee -a data/prep_log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: data
          retention-days: 7

  train:
    needs: [setup, prep]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install pillow==11.0.0 numpy==2.1.3 onnx==1.17.0
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: data
      - name: Startgewichte aus einem früheren Lauf
        if: matrix.cfg.resume
        run: |
          git fetch -q --depth 1 origin ml-results
          git show "origin/ml-results:${{ matrix.cfg.resume }}" > init.pt
          ls -l init.pt
      - name: Trainieren
        working-directory: ml
        env:
          SYNTH_HARD: ${{ matrix.cfg.hard || '0' }}
        run: |
          set -o pipefail
          mkdir -p ../out
          python train.py --minutes ${{ matrix.cfg.minutes || needs.setup.outputs.minutes }} \
            ${{ matrix.cfg.resume && '--resume ../init.pt' || '' }} \
            --lr ${{ matrix.cfg.lr || '0.003' }} \
            --real-frac ${{ matrix.cfg.real_frac || '0.25' }} \
            --out ../out/${{ matrix.cfg.name }} \
            --textures ../data/textures --real ../data/real_train \
            --eval-real ../data/real_eval \
            --widths ${{ matrix.cfg.widths }} --dec ${{ matrix.cfg.dec }} \
            --workers 3 2>&1 | tee ../out/console_${{ matrix.cfg.name }}.txt
      - name: Ergebnisse auf den Zweig ml-results
        if: always()
        env:
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          NAME: ${{ matrix.cfg.name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          for attempt in 1 2 3 4 5; do
            rm -rf res
            if ! git clone -q --depth 1 --branch ml-results "$url" res; then
              git clone -q --depth 1 "$url" res && (cd res && git checkout -q --orphan ml-results && git rm -rqf .)
            fi
            mkdir -p "res/runs/$RUN"
            cp -r out/. "res/runs/$RUN/" 2>/dev/null || true
            cp data/prep_log.txt "res/runs/$RUN/" 2>/dev/null || true
            find "res/runs/$RUN" -name '*.pt' -size +40M -delete || true
            if [ ! -d res/eval_real ] && [ -d data/real_eval ]; then
              cp -r data/real_eval res/eval_real
            fi
            echo "$SHA" > "res/runs/$RUN/source_sha.txt"
            cd res
            git add -A
            git commit -q -m "Trainingslauf $RUN ($NAME)" || exit 0
            if git push -q origin ml-results; then exit 0; fi
            cd ..
            sleep $((attempt * 7))
          done
          exit 1
